<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Generator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at top left,#dbeafe,transparent 35%),
        radial-gradient(circle at bottom right,#fce7f3,transparent 35%),
        linear-gradient(135deg,#eef2ff,#f8fafc);

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:460px;

    background:rgba(255,255,255,.97);

    border-radius:22px;

    padding:30px;

    text-align:center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.12);

    border:1px solid rgba(255,255,255,.8);
}

/* HEADER */

.header{
    margin-bottom:22px;
}

.logoIcon{
    width:60px;
    height:60px;

    margin:0 auto 12px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6,
            #ec4899
        );

    box-shadow:
        0 10px 25px rgba(99,102,241,.35);
}

h1{
    margin:0;

    font-size:28px;

    color:#111827;
}

.subtitle{
    margin-top:7px;

    color:#6b7280;

    font-size:14px;
}

/* TEXT INPUT */

textarea{
    width:100%;

    min-height:130px;

    resize:vertical;

    padding:15px;

    border:2px solid #e5e7eb;

    border-radius:12px;

    font-size:16px;

    font-family:Arial,sans-serif;

    outline:none;

    transition:.2s;
}

textarea:focus{
    border-color:#6366f1;

    box-shadow:
        0 0 0 4px rgba(99,102,241,.10);
}

/* COUNTER */

.counter{
    text-align:right;

    margin-top:6px;

    font-size:12px;

    color:#8b5cf6;
}

/* SETTINGS */

.settings{
    margin-top:14px;

    display:flex;

    flex-direction:column;

    gap:10px;
}

select{
    width:100%;

    padding:13px;

    border:2px solid #e5e7eb;

    border-radius:10px;

    background:white;

    font-size:14px;

    outline:none;

    cursor:pointer;
}

select:focus{
    border-color:#8b5cf6;
}

/* LOGO SECTION */

.logo-section{
    margin-top:14px;

    padding:15px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #f5f3ff,
            #fdf2f8
        );

    border:1px solid #e9d5ff;

    text-align:left;
}

.logo-title{
    font-size:14px;

    font-weight:bold;

    color:#374151;

    margin-bottom:10px;
}

.logo-row{
    display:flex;

    gap:10px;

    align-items:center;
}

.logo-upload{
    flex:1;

    position:relative;
}

.logo-upload input{
    width:100%;

    padding:10px;

    border:1px solid #d1d5db;

    border-radius:8px;

    background:white;

    font-size:13px;
}

.remove-logo{
    width:auto;

    margin:0;

    padding:10px 13px;

    background:#fee2e2;

    color:#dc2626;

    font-size:13px;

    display:none;
}

.remove-logo:hover{
    background:#fecaca;
}

/* LOGO SIZE */

.logo-size{
    margin-top:10px;

    display:none;
}

.logo-size label{
    display:flex;

    justify-content:space-between;

    font-size:12px;

    color:#6b7280;

    margin-bottom:5px;
}

.logo-size input{
    width:100%;

    accent-color:#8b5cf6;

    cursor:pointer;
}

/* BUTTONS */

button{
    width:100%;

    padding:14px;

    margin-top:13px;

    border:0;

    border-radius:11px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.generate{

    color:white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6,
            #ec4899
        );

    box-shadow:
        0 8px 20px rgba(139,92,246,.25);
}

.generate:hover{
    transform:translateY(-1px);

    box-shadow:
        0 12px 25px rgba(139,92,246,.35);
}

.download{

    color:white;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    display:none;

    box-shadow:
        0 8px 18px rgba(16,185,129,.25);
}

.download:hover{
    transform:translateY(-1px);
}

/* QR CARD */

.qr-card{

    margin-top:22px;

    padding:18px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );

    border:1px solid #e5e7eb;

    min-height:20px;
}

#qrcode{

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;
}

#qrcode img{

    max-width:100%;

    height:auto;

    image-rendering:pixelated;

    background:white;

    padding:10px;

    border-radius:8px;
}

/* ERROR */

.error{

    display:none;

    margin-top:10px;

    color:#dc2626;

    font-size:14px;

    background:#fef2f2;

    padding:10px;

    border-radius:8px;
}

/* INFO */

.info{

    margin-top:18px;

    font-size:12px;

    color:#9ca3af;
}

.status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    margin-top:8px;

    font-size:12px;

    color:#059669;
}

.status-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#10b981;
}

/* MOBILE */

@media(max-width:500px){

    body{
        padding:12px;
    }

    .container{
        padding:22px;

        border-radius:18px;
    }

    h1{
        font-size:24px;
    }

    .logo-row{
        flex-direction:column;
        align-items:stretch;
    }

    .remove-logo{
        width:100%;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logoIcon">
            QR
        </div>

        <h1>QR Generator</h1>

        <div class="subtitle">
            High Capacity • Works Offline
        </div>

    </div>


    <!-- TEXT -->

    <textarea
        id="qrText"
        placeholder="Enter text, URL or other information..."
    ></textarea>


    <div class="counter">
        Characters:
        <span id="counter">0</span>
    </div>


    <!-- ERROR CORRECTION -->

    <div class="settings">

        <select id="errorLevel">

            <option value="L">
                Error Correction: L — Maximum Capacity
            </option>

            <option value="M">
                Error Correction: M — Medium
            </option>

            <option value="Q">
                Error Correction: Q — High
            </option>

            <option value="H" selected>
                Error Correction: H — Maximum Protection
            </option>

        </select>

    </div>


    <!-- LOGO -->

    <div class="logo-section">

        <div class="logo-title">
            🖼️ Add Logo to QR
        </div>

        <div class="logo-row">

            <div class="logo-upload">

                <input
                    type="file"
                    id="logoInput"
                    accept="image/png,image/jpeg,image/webp"
                >

            </div>

            <button
                type="button"
                id="removeLogo"
                class="remove-logo"
                onclick="removeLogo()"
            >
                Remove
            </button>

        </div>


        <div
            id="logoSizeBox"
            class="logo-size"
        >

            <label>

                <span>Logo Size</span>

                <span>
                    <span id="logoSizeValue">22</span>%
                </span>

            </label>

            <input
                type="range"
                id="logoSize"
                min="12"
                max="28"
                value="22"
            >

        </div>

    </div>


    <!-- GENERATE -->

    <button
        class="generate"
        onclick="generateQR()"
    >
        Generate QR
    </button>


    <!-- ERROR -->

    <div
        id="error"
        class="error"
    ></div>


    <!-- QR -->

    <div class="qr-card">

        <div id="qrcode"></div>

    </div>


    <!-- DOWNLOAD -->

    <button
        id="downloadBtn"
        class="download"
        onclick="downloadQR()"
    >
        Download QR PNG
    </button>


    <div class="info">

        100% Offline • No API • No CDN

        <div class="status">

            <span class="status-dot"></span>

            Ready

        </div>

    </div>

</div>


<!--
====================================================
IMPORTANT

Keep qrcode.js in the SAME folder as index.html.

Folder:

index.html
qrcode.js

No internet/CDN required.
====================================================
-->

<script src="qrcode.js"></script>


<script>

let currentQR = null;

let uploadedLogo = null;


/* ==========================================
   CHARACTER COUNTER
========================================== */

document
.getElementById("qrText")
.addEventListener(
    "input",
    function(){

        document
        .getElementById("counter")
        .textContent =
            this.value.length;

    }
);


/* ==========================================
   LOGO UPLOAD
========================================== */

document
.getElementById("logoInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file){
            return;
        }


        if(!file.type.startsWith("image/")){

            alert("Please select an image.");

            this.value="";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const img =
                    new Image();


                img.onload =
                    function(){

                        uploadedLogo =
                            img;


                        document
                        .getElementById(
                            "removeLogo"
                        )
                        .style.display =
                            "block";


                        document
                        .getElementById(
                            "logoSizeBox"
                        )
                        .style.display =
                            "block";

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* ==========================================
   REMOVE LOGO
========================================== */

function removeLogo(){

    uploadedLogo = null;


    document
    .getElementById("logoInput")
    .value = "";


    document
    .getElementById("removeLogo")
    .style.display =
        "none";


    document
    .getElementById("logoSizeBox")
    .style.display =
        "none";


    /*
    Regenerate QR without logo
    if QR already exists.
    */

    if(
        document
        .getElementById("qrText")
        .value
        .trim()
    ){

        generateQR();

    }

}


/* ==========================================
   LOGO SIZE
========================================== */

document
.getElementById("logoSize")
.addEventListener(
    "input",
    function(){

        document
        .getElementById("logoSizeValue")
        .textContent =
            this.value;

        /*
        Automatically regenerate
        when logo size changes.
        */

        if(
            uploadedLogo &&
            document
            .getElementById("qrText")
            .value
            .trim()
        ){

            generateQR();

        }

    }
);


/* ==========================================
   GENERATE QR
========================================== */

function generateQR(){

    const text =
        document
        .getElementById("qrText")
        .value
        .trim();


    const level =
        document
        .getElementById("errorLevel")
        .value;


    const qrBox =
        document
        .getElementById("qrcode");


    const error =
        document
        .getElementById("error");


    const download =
        document
        .getElementById("downloadBtn");


    qrBox.innerHTML = "";

    download.style.display =
        "none";

    error.style.display =
        "none";


    if(!text){

        error.textContent =
            "Please enter text or URL.";

        error.style.display =
            "block";

        return;
    }


    try{

        /*
        0 = automatic Version 1–40
        */

        const qr =
            qrcode(
                0,
                level
            );


        /*
        Byte mode
        */

        qr.addData(
            text,
            "Byte"
        );


        qr.make();


        /*
        Generate QR image.
        */

        const imgHTML =
            qr.createImgTag(
                8,
                12,
                "QR Code"
            );


        qrBox.innerHTML =
            imgHTML;


        const qrImage =
            qrBox.querySelector("img");


        currentQR =
            qrImage;


        /*
        Add logo after QR loads.
        */

        if(uploadedLogo){

            addLogoToQR(
                qrImage,
                uploadedLogo
            );

        }


        download.style.display =
            "block";

    }
    catch(e){

        console.error(e);


        error.textContent =
            "Text is too long for a single QR code. Please reduce the text.";

        error.style.display =
            "block";

    }

}


/* ==========================================
   ADD LOGO TO QR
========================================== */

function addLogoToQR(
    qrImage,
    logo
){

    if(!qrImage)
        return;


    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext("2d");


    /*
    Wait until QR image is loaded.
    */

    function draw(){

        const width =
            qrImage.naturalWidth;


        const height =
            qrImage.naturalHeight;


        if(!width || !height)
            return;


        canvas.width =
            width;


        canvas.height =
            height;


        /*
        White background.
        */

        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        /*
        Draw QR.
        */

        ctx.imageSmoothingEnabled =
            false;


        ctx.drawImage(
            qrImage,
            0,
            0,
            width,
            height
        );


        /*
        Logo size.
        */

        const percentage =
            Number(
                document
                .getElementById(
                    "logoSize"
                )
                .value
            ) / 100;


        /*
        Keep logo reasonably small
        for reliable scanning.
        */

        const maxLogo =
            Math.min(
                width,
                height
            ) * percentage;


        let logoWidth =
            maxLogo;


        let logoHeight =
            maxLogo;


        /*
        Preserve logo aspect ratio.
        */

        if(
            logo.naturalWidth >
            logo.naturalHeight
        ){

            logoHeight =
                maxLogo *
                (
                    logo.naturalHeight /
                    logo.naturalWidth
                );

        }
        else if(
            logo.naturalHeight >
            logo.naturalWidth
        ){

            logoWidth =
                maxLogo *
                (
                    logo.naturalWidth /
                    logo.naturalHeight
                );

        }


        const x =
            (width-logoWidth)/2;


        const y =
            (height-logoHeight)/2;


        /*
        White protection area behind logo.
        */

        const padding =
            Math.max(
                12,
                maxLogo * .12
            );


        ctx.fillStyle =
            "#ffffff";


        roundRect(
            ctx,
            x-padding,
            y-padding,
            logoWidth+padding*2,
            logoHeight+padding*2,
            12
        );


        ctx.fill();


        /*
        Draw logo.
        */

        ctx.imageSmoothingEnabled =
            true;


        ctx.drawImage(
            logo,
            x,
            y,
            logoWidth,
            logoHeight
        );


        /*
        Replace displayed QR
        with final canvas image.
        */

        const finalImage =
            document.createElement("img");


        finalImage.src =
            canvas.toDataURL(
                "image/png"
            );


        finalImage.alt =
            "QR Code with Logo";


        finalImage.style.maxWidth =
            "100%";


        finalImage.style.height =
            "auto";


        finalImage.style.imageRendering =
            "pixelated";


        qrImage.replaceWith(
            finalImage
        );


        currentQR =
            finalImage;

    }


    if(qrImage.complete){

        draw();

    }
    else{

        qrImage.onload =
            draw;

    }

}


/* ==========================================
   ROUNDED RECTANGLE
========================================== */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    ctx.beginPath();

    ctx.moveTo(
        x+radius,
        y
    );

    ctx.lineTo(
        x+width-radius,
        y
    );

    ctx.quadraticCurveTo(
        x+width,
        y,
        x+width,
        y+radius
    );

    ctx.lineTo(
        x+width,
        y+height-radius
    );

    ctx.quadraticCurveTo(
        x+width,
        y+height,
        x+width-radius,
        y+height
    );

    ctx.lineTo(
        x+radius,
        y+height
    );

    ctx.quadraticCurveTo(
        x,
        y+height,
        x,
        y+height-radius
    );

    ctx.lineTo(
        x,
        y+radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+radius,
        y
    );

    ctx.closePath();

}


/* ==========================================
   DOWNLOAD FINAL QR
========================================== */

function downloadQR(){

    if(!currentQR)
        return;


    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        currentQR.naturalWidth;


    canvas.height =
        currentQR.naturalHeight;


    ctx.imageSmoothingEnabled =
        false;


    ctx.drawImage(
        currentQR,
        0,
        0
    );


    const link =
        document.createElement("a");


    link.download =
        uploadedLogo
        ? "qr-code-with-logo.png"
        : "qr-code.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);

}


/* ==========================================
   CTRL + ENTER
========================================== */

document
.getElementById("qrText")
.addEventListener(
    "keydown",
    function(e){

        if(
            e.ctrlKey &&
            e.key === "Enter"
        ){

            generateQR();

        }

    }
);

</script>

</body>
</html>
